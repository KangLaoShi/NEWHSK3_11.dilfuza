            -ms-overflow-style: none;

                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const FillBlanksQuiz = () => {
            const [shuffledQuestions, setShuffledQuestions] = React.useState([]);
            const [currentQ, setCurrentQ] = React.useState(0);
            const [score, setScore] = React.useState(0);
            const [showResult, setShowResult] = React.useState(false);
            const [selectedOpt, setSelectedOpt] = React.useState(null);

            React.useEffect(() => {
                startQuiz();
            }, []);

            const startQuiz = () => {
                const processQs = fillBlanksData.map(q => ({
                    ...q,
                    opts: shuffle([...q.opts])
                }));
                setShuffledQuestions(shuffle(processQs));
                setCurrentQ(0);
                setScore(0);
                setShowResult(false);
                setSelectedOpt(null);
            };

            const handleAnswer = (opt) => {
                if (selectedOpt) return;
                setSelectedOpt(opt);
                
                if (opt === shuffledQuestions[currentQ].ans) setScore(s => s + 1);

                setTimeout(() => {
                    if (currentQ + 1 < shuffledQuestions.length) {
                        setCurrentQ(c => c + 1);
                        setSelectedOpt(null);
                    } else {
                        setShowResult(true);
                    }
                }, 1200);
            };

            if (shuffledQuestions.length === 0) return null;

            if (showResult) {
                return (
                    <div className="flex flex-col items-center justify-center py-20 text-center">
                        <CheckCircleIcon />
                        <h2 className="text-4xl font-bold mt-4 mb-2">Ajoyib!</h2>
                        <p className="text-2xl text-emerald-300 mb-8">Natijangiz: {score} / {shuffledQuestions.length}</p>
                        <button onClick={startQuiz} className="px-8 py-3 bg-emerald-600 hover:bg-emerald-500 rounded-full font-semibold shadow-lg transition">Qayta boshlash</button>
                    </div>
                );
            }

            const q = shuffledQuestions[currentQ];
            // Format question to have a visual blank
            const parts = q.q.split('(_____)');
            const visualQ = (
                <span>
                    {parts[0]}
                    <span className={`inline-block border-b-2 mx-2 text-center min-w-[60px] font-bold ${selectedOpt ? (selectedOpt === q.ans ? 'text-emerald-400 border-emerald-400' : 'text-red-400 border-red-400') : 'text-transparent border-slate-400'}`}>
                        {selectedOpt ? selectedOpt : '___'}
                    </span>
                    {parts[1]}
                </span>
            );

            return (
                <div className="max-w-3xl mx-auto py-10 px-4">
                    <div className="flex justify-between items-center mb-6 text-sm text-slate-400">
                        <span>Savol {currentQ + 1} / {shuffledQuestions.length}</span>
                        <span>To'g'ri: {score}</span>
                    </div>
                    
                    <div className="glass-panel p-10 rounded-3xl text-center shadow-2xl mb-10 min-h-[160px] flex items-center justify-center">
                        <h2 className="text-3xl md:text-5xl font-bold zh-text leading-loose">
                            {visualQ}
                        </h2>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        {q.opts.map((opt, i) => {
                            let btnClass = "p-4 rounded-xl text-2xl zh-text font-bold transition shadow-lg border ";
                            if (!selectedOpt) {
                                btnClass += "bg-white/5 hover:bg-white/20 border-white/10 hover:border-cyan-400/50";
                            } else {
                                if (opt === q.ans) {
                                    btnClass += "bg-emerald-500/80 border-emerald-400 shadow-[0_0_15px_rgba(16,185,129,0.5)]";
                                } else if (opt === selectedOpt) {
                                    btnClass += "bg-red-500/80 border-red-400";
                                } else {
                                    btnClass += "bg-white/5 border-white/5 opacity-30";
                                }
                            }

                            return (
                                <button key={i} onClick={() => handleAnswer(opt)} className={btnClass} disabled={!!selectedOpt}>
                                    {opt}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = React.useState('fleshkartalar');

            const tabs = [
                { id: 'fleshkartalar', label: "Fleshkartalar", icon: "🎴" },
                { id: 'lug_at_testi', label: "Lug'at Testi", icon: "🎯" },
                { id: 'muloqot', label: "Muloqot", icon: "💬" },
                { id: 'grammatika', label: "Grammatika", icon: "📖" },
                { id: 'grammatika_testi', label: "Grammatika Testi", icon: "📝" },
                { id: 'soz_toldirish', label: "So'zlarni To'ldirish", icon: "🧩" }
            ];

            return (
                <div className="flex flex-col min-h-screen">
                    {/* Header */}
                    <header className="glass-panel sticky top-0 z-50 rounded-b-3xl border-t-0 mb-6 border-b border-white/10 shadow-lg bg-[#0f172a]/80">
                        <div className="max-w-6xl mx-auto px-4 py-5 text-center">
                            <h1 className="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400 drop-shadow-sm mb-2">
                                看来我没办法解决这个问题
                            </h1>
                            <p className="text-sm md:text-base text-slate-300 font-medium tracking-wide flex items-center justify-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-yellow-400"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
                                Dilfuza Kāng lǎo shī bilan xitoy tilini o'rganmiz
                            </p>
                        </div>
                        
                        {/* Navigation Scrollable */}
                        <div className="max-w-6xl mx-auto px-2 overflow-x-auto hide-scroll pb-2">
                            <div className="flex space-x-2 md:justify-center min-w-max px-2">
                                {tabs.map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`px-5 py-2.5 rounded-full text-sm font-semibold transition-all duration-300 flex items-center gap-2 ${activeTab === tab.id ? 'bg-gradient-to-r from-cyan-600 to-purple-600 text-white shadow-lg shadow-cyan-500/25 border-transparent border' : 'bg-white/5 text-slate-300 hover:bg-white/10 border border-white/10'}`}
                                    >
                                        <span>{tab.icon}</span> {tab.label}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 max-w-6xl w-full mx-auto p-4 mb-20 relative">
                        {/* Decorative Background Blob */}
                        <div className="absolute top-1/4 left-1/4 w-96 h-96 bg-cyan-500/10 rounded-full mix-blend-screen filter blur-3xl opacity-50 animate-pulse pointer-events-none"></div>
                        <div className="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-500/10 rounded-full mix-blend-screen filter blur-3xl opacity-50 pointer-events-none"></div>
                        
                        <div className="relative z-10">
                            {activeTab === 'fleshkartalar' && <Flashcards />}
                            {activeTab === 'muloqot' && <Dialogues />}
                            {activeTab === 'grammatika' && <Grammar />}
                            {activeTab === 'lug_at_testi' && <VocabQuiz />}
                            {activeTab === 'grammatika_testi' && <GrammarQuiz />}
                            {activeTab === 'soz_toldirish' && <FillBlanksQuiz />}
                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="glass-panel border-b-0 border-t border-white/10 py-6 text-center text-slate-400 mt-auto bg-[#0f172a]/90 backdrop-blur-md">
                        <p className="text-sm font-semibold mb-1">HSK 3 NEW3.0 - Lesson 11</p>
                        <p className="text-xs">© 2026 Dilfuza Kāng lǎo shī (telegram@diffila)</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
