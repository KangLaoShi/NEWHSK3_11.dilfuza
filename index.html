        lines: [
          { speaker: "王一雪", cn: "今天下午经理不在，不开会了。", py: "Jīntiān xiàwǔ jīnglǐ bù zài, bù kāihuì le.", uz: "Bugun tushdan keyin menejer yo'q, majlis bo'lmaydi.", ru: "Сегодня днем менеджера нет, собрания не будет.", en: "The manager is not here this afternoon, there will be no meeting." },

          { speaker: "王一雪", cn: "已经接好了，您开机看看有没有问题。", py: "Yǐjīng jiē hǎo le, nín kāijī kànkan yǒu méiyǒu wèntí.", uz: "Allaqachon ulandi, yoqib ko'ring muammo yo'qmi.", ru: "Уже подключен, включите и посмотрите, есть ли проблемы.", en: "It's already connected, turn it on and see if there are any problems." },
          { speaker: "杨同乐", cn: "现在什么都看不见。", py: "Xiànzài shénme dōu kàn bu jiàn.", uz: "Hozir hech narsa ko'rinmayapti.", ru: "Сейчас ничего не видно.", en: "I can't see anything right now." },

      {

          { speaker: "王一雪", cn: "好几个同事都休假了，开会前这么多工作我怕干不完。", py: "Hǎo jǐ gè tóngshì dōu xiūjià le, kāihuì qián zhème duō gōngzuò wǒ pà gàn bù wán.", uz: "Bir nechta hamkasblar ta'tilga chiqishdi, majlisdan oldin bunchalik ko'p ishni tugata olmayman deb qo'rqaman.", ru: "Несколько коллег в отпуске, боюсь, что не смогу закончить так много работы до собрания.", en: "Several colleagues are on vacation, I'm afraid I won't be able to finish so much work before the meeting." },
          { speaker: "杨同乐", cn: "十二点多了，咱们先去吃饭吧。吃完饭，我跟您一起把这些工作做完。", py: "Shí'èr diǎn duō le, zánmen xiān qù chīfàn ba. Chī wán fàn, wǒ gēn nín yìqǐ bǎ zhèxiē gōngzuò zuò wán.", uz: "O'n ikkidan o'tdi, avval ovqatlanib kelaylik. Ovqatdan keyin men siz bilan birga bu ishlarni tugataman.", ru: "Уже больше двенадцати, давайте сначала пойдем поедим. После еды я помогу вам закончить эту работу.", en: "It's past twelve, let's go eat first. After eating, I'll finish this work with you." },
          { speaker: "王一雪", cn: "你先去吃，我想再干一会儿。明天开会前要发到公司的邮箱里。", py: "Nǐ xiān qù chī, wǒ xiǎng zài gàn yíhuìr. Míngtiān kāihuì qián yào fā dào gōngsī de yóuxiāng lǐ.", uz: "Siz avval borib ovqatlaning, men yana biroz ishlamoqchiman. Ertaga majlisdan oldin kompaniya pochtasiga yuborishim kerak.", ru: "Идите сначала поешьте, я хочу еще немного поработать. До завтрашнего собрания нужно отправить на корпоративную почту.", en: "You go eat first, I want to work a little longer. I need to send it to the company email before the meeting tomorrow." },
          { speaker: "杨同乐", cn: "您没看到邮件吗？经理还没回来呢，下周才能开会。", py: "Nín méi kàndào yóujiàn ma? Jīnglǐ hái méi huílái ne, xià zhōu cái néng kāihuì.", uz: "Elektron xatni ko'rmadingizmi? Menejer hali qaytib kelgani yo'q, majlis faqat keyingi haftada bo'ladi.", ru: "Разве вы не видели письмо? Менеджер еще не вернулся, собрание будет только на следующей неделе.", en: "Didn't you see the email? The manager hasn't come back yet, the meeting won't be until next week." },
          { speaker: "王一雪", cn: "那不着急了。走，吃饭去。", py: "Nà bù zháojí le. Zǒu, chīfàn qù.", uz: "Unda shoshilmaymiz. Qani, ovqatlanishga boramiz.", ru: "Тогда можно не спешить. Пойдемте есть.", en: "Then there's no rush. Let's go eat." }

      {
        title: "课文 4: 在家里，王一雪在写日记",
        lines: [
          { speaker: "王一雪", cn: "前几天，上海的同事来北京了。", py: "Qián jǐ tiān, Shànghǎi de tóngshì lái Běijīng le.", uz: "Bir necha kun oldin, Shanxaylik hamkasblar Pekinga kelishdi.", ru: "Несколько дней назад коллеги из Шанхая приехали в Пекин.", en: "A few days ago, colleagues from Shanghai came to Beijing." },

    const QuizTab = ({ questions, title }) => {
      const [currentIdx, setCurrentIdx] = useState(0);
      const [score, setScore] = useState(0);
      const [showResult, setShowResult] = useState(false);
      const [selectedOpt, setSelectedOpt] = useState(null);
      const [finished, setFinished] = useState(false);

      const handleSelect = (idx) => {
        if (showResult) return;
        setSelectedOpt(idx);
        setShowResult(true);
        if (idx === questions[currentIdx].correctIdx) {
          setScore(score + 1);
        }
      };

      const handleNext = () => {
        if (currentIdx < questions.length - 1) {
          setCurrentIdx(currentIdx + 1);
          setShowResult(false);
          setSelectedOpt(null);
        } else {
          setFinished(true);
        }
      };

      const restart = () => {
        setCurrentIdx(0);
        setScore(0);
        setShowResult(false);
        setSelectedOpt(null);
        setFinished(false);
      };

      if (finished) {
        return (
          <div className="flex flex-col items-center justify-center h-full animate-fade-in bg-white/5 backdrop-blur-lg p-10 rounded-3xl border border-white/10">
            <Award className="w-24 h-24 text-yellow-400 mb-6 drop-shadow-xl" />
            <h2 className="text-4xl font-bold text-white mb-4">Test Yakunlandi!</h2>
            <p className="text-2xl text-blue-200 mb-8">Natija: {score} / {questions.length}</p>
            <button onClick={restart} className="flex items-center gap-2 px-8 py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-full font-bold text-xl transition-all shadow-lg hover:shadow-blue-500/50">
              <RefreshCw className="w-6 h-6" /> Qayta boshlash
            </button>
          </div>
        );
      }

      const q = questions[currentIdx];

      return (
        <div className="max-w-3xl mx-auto w-full animate-fade-in">
          <div className="bg-white/10 backdrop-blur-xl border border-white/20 p-8 rounded-3xl shadow-2xl">
            <div className="flex justify-between items-center mb-8">

            </div>
            
            <h2 className="text-5xl font-bold text-center text-white mb-12 drop-shadow-md">{q.prompt}</h2>
            
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
              {q.options.map((opt, idx) => {
                let btnClass = "bg-white/10 hover:bg-white/20 text-white border-white/20";
                if (showResult) {
                  if (idx === q.correctIdx) btnClass = "bg-green-500/80 border-green-400 text-white";
                  else if (idx === selectedOpt) btnClass = "bg-red-500/80 border-red-400 text-white";
                  else btnClass = "bg-white/5 opacity-50 border-white/10 text-gray-400";
                }
                return (
                  <button
                    key={idx}
                    onClick={() => handleSelect(idx)}
                    disabled={showResult}
                    className={`p-6 text-xl rounded-2xl border backdrop-blur-sm transition-all text-left flex justify-between items-center ${btnClass}`}
                  >
                    <span>{opt}</span>
                    {showResult && idx === q.correctIdx && <CheckCircle2 className="w-6 h-6 text-white" />}
                    {showResult && idx === selectedOpt && idx !== q.correctIdx && <XCircle className="w-6 h-6 text-white" />}
                  </button>
                );
              })}
            </div>

            {showResult && (
              <div className="flex justify-end animate-fade-in">
                <button onClick={handleNext} className="px-8 py-3 bg-blue-500 hover:bg-blue-400 text-white rounded-full font-bold text-lg transition-all shadow-lg flex items-center gap-2">
                  Keyingisi <ChevronRight className="w-5 h-5" />
                </button>
              </div>
            )}
          </div>
        </div>
      );

        { id: 'grammar', label: 'Grammatika', icon: <BookOpen className="w-5 h-5"/> },
        { id: 'grammarTest', label: 'Grammatika Testi', icon: <CheckSquare className="w-5 h-5"/> },
        { id: 'fillBlank', label: "So'zlarni to'ldirish", icon: <Edit3 className="w-5 h-5"/> }
      ];

      return (
        <div className="min-h-screen text-white font-sans">
          
          {/* Header */}
          <header className="bg-white/5 backdrop-blur-md border-b border-white/10 sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 text-center">
              <h1 className="text-3xl md:text-4xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400 mb-2 drop-shadow-sm">
                HSK 3 - 11 Dars
              </h1>
              <p className="text-lg text-blue-200 font-medium tracking-wide">
                Dilfuza Kāng lǎo shī bilan xitoy tilini o'rganmiz
              </p>
            </div>
            
            {/* Navigation */}
            <div className="max-w-7xl mx-auto px-2 pb-4 overflow-x-auto no-scrollbar">
              <div className="flex justify-start md:justify-center space-x-2 w-max mx-auto px-2">
                {tabs.map((tab) => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex items-center gap-2 px-5 py-3 rounded-full font-bold text-sm transition-all whitespace-nowrap
                      ${activeTab === tab.id 
                        ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-lg shadow-blue-900/50 border border-blue-400/50' 
                        : 'bg-white/5 text-gray-300 hover:bg-white/10 hover:text-white border border-transparent'
                      }`}
                  >
                    {tab.icon} {tab.label}
                  </button>
                ))}
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8 min-h-[70vh]">
            {activeTab === 'flashcards' && <FlashcardTab />}
            {activeTab === 'vocabTest' && <QuizTab questions={VOCAB_TEST} title="Lug'at Testi (So'z ma'nosini toping)" />}
            {activeTab === 'dialogue' && <DialogueTab />}
            {activeTab === 'grammar' && <GrammarTab />}
            {activeTab === 'grammarTest' && <QuizTab questions={GRAMMAR_TEST} title="Grammatika Testi (To'g'ri javobni tanlang)" />}
            {activeTab === 'fillBlank' && <QuizTab questions={FILL_BLANK_TEST} title="So'zlarni to'ldirish (Bo'sh joyni to'ldiring)" />}
          </main>

          {/* Footer */}
          <footer className="border-t border-white/10 bg-black/20 mt-auto backdrop-blur-sm">
            <div className="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 text-center text-gray-400 text-sm space-y-2">
              <p className="font-semibold text-gray-300">HSK 3 NEW3.0 - Lesson 11</p>
              <p>© 2026 Dilfuza Kāng lǎo shī (telegram@diffila)</p>
            </div>
          </footer>
        </div>
      );
    };

    // --- 渲染 ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
